name: Build AMAF Imamo Tech APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build User APK (debug)
        run: gradle :app-user:assembleDebug --stacktrace

      - name: Build Admin APK (debug)
        run: gradle :app-admin:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: amaf-imamo-apks
          path: |
            app-user/build/outputs/apk/debug/*.apk
            app-admin/build/outputs/apk/debug/*.apk
